<!DOCTYPE html>

    <title>保护动物，从我做起</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f0f8f0;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }
        h1, h2 {
            color: #2e7d32;
        }
        section {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 15px 0;
        }
        ul {
            list-style-type: disc;
            padding-left: 40px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #4CAF50;
            color: white;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <header>
        <h1>保护动物，守护地球家园</h1>
        <p>动物是地球生态系统的重要组成部分，让我们共同行动起来！</p>
    </header>

    <section>
        <h2>为什么需要保护动物？</h2>
        <p>许多动物正面临灭绝的威胁，主要原因是栖息地破坏、非法狩猎和气候变化。保护动物不仅能维护生物多样性，还能保持生态平衡，让人类与自然和谐共存。</p>

    </section>

    <section>
        <h2>我们能做什么？</h2>
        <ul>
            <li>拒绝购买野生动物制品，如象牙、虎骨等。</li>
            <li>支持野生动物保护组织，参与捐款或志愿活动。</li>
            <li>减少塑料使用，保护动物栖息环境。</li>
            <li>传播保护意识，教育身边的人。</li>
            <li>参与植树造林，恢复自然生态。</li>
        </ul>

    </footer>
